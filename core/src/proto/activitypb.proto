syntax = "proto3";

package gamepb.activitypb;

import "corepb.proto";

message ActivityContent {
    int64 activity_id = 1;
    int64 group_id = 2;
    int64 type = 3;
    string name = 4;
    bytes extra = 5;
    int64 begin_time = 6;
    int64 end_time = 7;
    int64 sort_order = 8;
    int64 field_20 = 20;
    int64 field_21 = 21;
    int64 field_22 = 22;
    int64 field_23 = 23;
}

message ActivityItem {
    int64 item_id = 1;
    int64 count = 2;
}

message StarSandGoods {
    int64 goods_id = 1;
    ActivityItem item = 2;
    ActivityItem cost = 3;
    int64 status = 4; // Previously decoded as field_4.
    bool owned = 5;
    int64 sort_order = 6;
    bytes name = 7;
    bytes resource_json = 8;
    int64 field_10 = 10;
    int64 field_11 = 11;
    bytes category = 12;
}

message StarSandGoodsList {
    repeated StarSandGoods goods = 1;
}

message ConstellationNode {
    int64 node_id = 1;
    bool field_2 = 2;
    bool field_3 = 3;
    bool field_4 = 4;
    repeated ActivityItem rewards = 5;
}

message ConstellationGroup {
    int64 group_id = 1;
    bool field_2 = 2;
    string name = 3;
    string links = 4;
    string config_json = 5;
}

message ConstellationData {
    int64 field_1 = 1;
    int64 field_2 = 2;
    int64 field_3 = 3;
    repeated ConstellationNode nodes = 4;
    repeated ConstellationGroup groups = 5;
}

message ActivityData {
    ActivityContent activity = 1;
    repeated ActivityData children = 2;
    StarSandGoodsList catalog = 102;
    QingMeiDailySeedData qingmei_daily_seed = 103;
    QingMeiBrewData qingmei_brew = 108;
    ConstellationData constellation = 110;
    QixiBridgeConfig qixi_bridge = 112;
    QixiGiftProgress qixi_gift = 113;
    // tag 114 被不同活动复用：青梅为报价，雨落成诗为天气任务状态。
    // 保留原始负载，由领域服务根据 activity_id/type 再解码，避免互相误读。
    bytes extension_114 = 114;
    WeatherCollectionConfig weather_collection = 105;
    WeatherTaskList weather_tasks = 117;
    WeatherResearchTree weather_research = 118;
}

message ActivityWindow {
    int64 id = 1;
    string name = 2;
    int64 begin_time = 3;
    int64 end_time = 4;
}

message ActivityListRequest {}

message ActivityListReply {
    repeated ActivityData activities = 1;
    repeated ActivityWindow activity_windows = 2;
}

message GetGroupRequest {
    int64 group_id = 1;
}

message GetGroupReply {
    ActivityData group = 1;
}

message QingMeiDailySeedGrant {
    int64 grant_id = 1;
    ActivityItem item = 3;
}

message QingMeiDailySeedData {
    bool claimed = 1;
    QingMeiDailySeedGrant grant = 2;
}

message QingMeiBrewData {
    int64 base_gold = 1;
    int64 current_round = 2;
    int64 max_rounds = 3;
    repeated int64 quote_prices = 4 [packed = true];
    repeated int64 quote_totals = 5 [packed = true];
    bool finished = 6;
    int64 base_price = 7;
    repeated int64 ingredient_item_ids = 8 [packed = true];
    int64 guaranteed_price = 9;
}

message QixiBridgeStage {
    int64 stage = 1;
    ActivityItem cost = 2;
    repeated ActivityItem rewards = 3;
    int64 status = 4;
}

message QixiBridgeConfig {
    repeated ActivityItem display_items = 1;
    repeated QixiBridgeStage stages = 2;
    int64 current_stage = 3;
}

message QixiGiftExchange {
    repeated ActivityItem cost_items = 1;
    repeated ActivityItem receive_items = 2;
    int64 gift_type = 3;
    int64 content = 4;
}

message QixiGiftProgress {
    int64 total_send_count = 1;
    int64 total_send_limit = 2;
    int64 total_receive_limit = 3;
    repeated QixiGiftExchange gifts = 4;
}

message QingMeiBrewStarted {
    int64 base_gold = 1;
}

message QingMeiQuote {
    int64 round = 1;
    int64 unit_price = 2;
    int64 total_gold = 3;
    bool doubled = 4;
}

message WeatherCollectionRewardConfig {
    int64 id = 1;
    ActivityItem item = 3;
    int64 reward_type = 4;
    string probability = 6;
}

message WeatherCollectionConfig {
    int64 operate_type = 3;
    int64 daily_limit = 4;
    int64 consume_item_id = 5;
    int64 consume_count = 6;
    WeatherCollectionRewardConfig reward = 8;
    bool enabled = 9;
}

message WeatherTask {
    int64 task_id = 1;
    int64 item_id = 2;
    ActivityItem reward = 3;
    string name = 4;
    int64 target = 5;
    int64 progress = 6;
}

message WeatherTaskList {
    repeated WeatherTask tasks = 1;
}

message WeatherResearchNode {
    int64 node_id = 1;
    repeated int64 prerequisite_ids = 2 [packed = true];
    int64 status = 3;
    bool claimed = 4;
    bool enabled = 5;
    ActivityItem cost = 6;
    ActivityItem reward = 7;
    bool premium = 8;
    int64 premium_value = 9;
}

message WeatherResearchGroup {
    int64 group_id = 1;
    repeated WeatherResearchNode nodes = 2;
}

message WeatherResearchTree {
    repeated WeatherResearchGroup groups = 1;
}

message QingMeiSettlement {
    int64 settlement_mode = 1;  // 1=直接卖出，2=分享后结算
    int64 total_gold = 2;
    corepb.Item reward = 3;
}

// ActivityService.Operate selectors are fixed by the callers below. No generic
// operate_type is exposed by the HTTP API.
message QueryActivityRequest {
    int64 activity_id = 1;
    int64 operate_type = 2;
}

message ExchangeShopOperateParams {
    int64 goods_id = 1;
    int64 count = 2;
}

message ExchangeShopRequest {
    int64 activity_id = 1;
    int64 operate_type = 2;
    ExchangeShopOperateParams exchange_shop_operate = 101;
}

message OperateConstellationRequest {
    message Empty {}

    int64 activity_id = 1;
    int64 operate_type = 2;
    Empty field_119 = 119;
}

message ClaimQingMeiDailySeedRequest {
    message Params { int64 grant_id = 1; }
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 103;
}

message StartQingMeiBrewRequest {
    message Ingredient {
        int64 uid = 1;
        int64 count = 2;
    }
    message Params { repeated Ingredient ingredients = 1; }
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 112;
}

message ContinueQingMeiBrewRequest {
    message Empty {}
    int64 activity_id = 1;
    int64 operate_type = 2;
    Empty params = 113;
}

message SettleQingMeiBrewRequest {
    message Params { int64 settlement_mode = 1; }  // 1=直接卖出，2=分享后结算
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 114;
}

message ClaimQixiBridgeRewardsRequest {
    message Params { int64 step = 1; }
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 125;
}

message GiftQixiSachetRequest {
    message Params {
        int64 target_gid = 1;
        int64 msg_text_id = 2;
    }
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 124;
}

message CollectRainWeatherRequest {
    message Params { int64 target_gid = 3; }
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 107;
}

message UnlockRainResearchRequest {
    message Params { int64 node_id = 1; }
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 140;
}

message WeatherExchangeResult {
    corepb.Item received_item = 1;
    ActivityItem cost = 2;
}

message WeatherCollectedReward {
    int64 id = 1;
    ActivityItem item = 2;
}

message WeatherCollectionResult {
    WeatherCollectedReward selected_reward = 1;
    ActivityItem received_item = 2;
    ActivityItem consumed_item = 3;
}

message WeatherResearchResult {
    int64 node_id = 1;
    corepb.Item reward = 2;
    repeated int64 unlocked_node_ids = 3 [packed = true];
}

message QixiGiftResult {
    int64 total_send_count = 1;
}

message QixiBridgeRewardResult {
    repeated int64 unlocked_steps = 1 [packed = true];
    repeated corepb.Item awards = 2;
    bool completed = 3;
}

message ActivityOperateReply {
    int64 activity_id = 1;
    int64 operate_type = 2;
    ActivityData data = 3;
    repeated corepb.Item rewards = 104;
    QingMeiBrewStarted qingmei_brew_started = 113;
    QingMeiQuote qingmei_quote = 114;
    QingMeiSettlement qingmei_settlement = 115;
    QixiGiftResult qixi_gift_result = 125;
    QixiBridgeRewardResult qixi_bridge_result = 126;
    WeatherExchangeResult weather_exchange_result = 101;
    WeatherCollectionResult weather_collection_result = 108;
    WeatherResearchResult weather_research_result = 140;
}

message ActiviesChangeNotify {
    // 抓包确认推送包含父活动及 children，而不只是平铺 ActivityContent。
    repeated ActivityData activities = 1;
}
